name: publish

# Release = push a version tag. On a v* tag: re-run the full E2E gate in a clean
# environment, verify the tag matches package.json version (no accidental mismatched
# publish), then publish to npm. Requires an NPM_TOKEN repo secret (maintainer adds it;
# the automation cannot).
#
# workflow_dispatch exists because this has already failed twice on a bad token
# (v0.8.0 and v0.9.0, both `npm error code EOTP` — see issue #119). Both times the
# workflow itself was correct: gates passed, the tarball built, and the registry
# refused the token. Recovering from that used to mean finding a run id, or deleting
# and force-pushing a tag that already looks published. Now: fix the secret, hit Run
# workflow, pick the tag. The tag-matches-version gate below still runs, so a dispatch
# against the wrong ref fails closed rather than publishing a mismatch.
#
# There is deliberately NO token preflight. `npm whoami` succeeds for both token types
# and `npm publish --dry-run` never touches auth, so nothing here can tell a
# publish-capable token from one that will demand a one-time password. A check that
# cannot discriminate would only add false confidence.

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish (e.g. v0.9.0). Defaults to the branch/tag this was dispatched from.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          # on a tag push GITHUB_REF_NAME is the tag; on a dispatch it is whatever was
          # dispatched, so prefer the explicit input when one was given
          tag="${{ inputs.ref || '' }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          echo "tag=$tag pkg=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json $pkg — bump the version and re-tag, or dispatch against the matching tag"
            exit 1
          fi
      - name: E2E gate
        run: npm test
      # Manual publishing is the ACTUAL release path here (0.8.1, 0.9.0, 0.10.0 — 3/3),
      # so a tag is routinely pushed for a version that is already on the registry. Left
      # alone, `npm publish` returns a 403 duplicate and this run goes red for a release
      # that in fact succeeded — a red X that means the opposite of what a reader assumes.
      # Deliberately placed AFTER both gates above, so a mismatched tag still fails closed
      # rather than being short-circuited into a green skip.
      - name: Already published?
        id: already
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          # A lookup FAILURE is not an answer. "cannot tell" and "already done" are
          # different, and treating the first as the second would silently skip a real
          # publish — so this only proceeds on a successful query.
          if ! versions=$(npm view "$pkg" versions --json 2>/dev/null); then
            echo "::error::could not query the registry for $pkg — refusing to guess whether $ver is published"
            exit 1
          fi
          if node -e "process.exit(JSON.parse(process.argv[1]).includes(process.argv[2])?0:1)" "$versions" "$ver"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$pkg@$ver is already on the registry — nothing to publish. This is the expected outcome when the version was published by hand and the tag was pushed afterwards (see README § CI & releasing)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.already.outputs.skip != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: If this failed with EOTP
        if: failure()
        shell: bash
        run: |
          echo "::notice::If the failure above is 'npm error code EOTP', the NPM_TOKEN secret cannot publish without an interactive one-time password. Replace it with a Granular Access Token (Read and write, scoped to this package) — not a Classic token — then re-run via Run workflow. See README § CI & releasing."
